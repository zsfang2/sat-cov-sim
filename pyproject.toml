[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-coverage-sim"
version = "0.1.0"
description = "Lightweight satellite-to-ground coverage simulation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pyproj>=3.4",
  "rasterio>=1.3",
  "geopandas>=0.13",
  "skyfield>=1.46",
]

[project.scripts]
sat-cover = "satellite_coverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

